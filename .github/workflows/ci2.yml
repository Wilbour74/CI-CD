name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier la syntaxe
        run: node --check server.js

      - name: Lancer le build
        run: npm run build

      - name: Verifier le fichier de build
        run: |
          if [ -f dist/server.js ]; then
            echo "Le fichier dist/server.js existe."
          else
            echo "Erreur : le fichier dist/server.js n'existe pas."
            exit 1
          fi

      - name: Sauvegarder dist comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Ecrire le resultat dans le resume GitHub
        run: |
          echo "Build reussi : dist/server.js a ete genere et sauvegarde comme artefact." >> "$GITHUB_STEP_SUMMARY"

