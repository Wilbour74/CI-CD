name: EXO3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choisir l environnement de deploiement'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuper le depot
        uses: actions/checkout@v7
      
      - name: Recuperer les dependances
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Installer les dependances
        run: npm ci
      
      - name: Execution du build
        run: npm run build

      - name: Publier dist comme artefact nommé application-build
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Ecrire le statut du job dans $GITHUB_STEP_SUMMARY
        run: echo "Tests passed successfully!" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: test
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Recuperer l artefact de build
        uses: actions/download-artifact@v7
        with:
          name: application
          path: dist/

      - name: Ecrire l environnement et le commit dans le resume
        run: |
          {
            echo "## Build termine"
            echo "- Environnement : $TARGET_ENVIRONMENT"
            echo "- API URL : $API_URL"
            echo "- Commit : $GITHUB_SHA"
            echo "- Artefact : application (dist/server.js)"
          } >> "$GITHUB_STEP_SUMMARY"
    